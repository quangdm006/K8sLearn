apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: capstone
resources:
  - namespace.yaml
  - redis.yaml
  - backend.yaml
  - frontend.yaml
  - network-policies.yaml
  - gateway.yaml
labels:
  - pairs:
      app.kubernetes.io/part-of: shop
configMapGenerator:
  - name: frontend-config
    literals:
      - PODINFO_UI_MESSAGE=Chào mừng tới dự án cuối khóa K8s Learn!
      - PODINFO_UI_COLOR=#326ce5
