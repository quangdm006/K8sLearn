server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # VitePress bật cleanUrls: /co-ban/pod được phục vụ từ /co-ban/pod.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Tệp trong /assets có hash trong tên nên cache được rất lâu
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Endpoint cho readiness/liveness probe
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    error_page 404 /404.html;
}
